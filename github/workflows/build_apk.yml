name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إنشاء هيكل مشروع أندرويد تلقائياً إن لم يكن موجوداً
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Android Project Files
        run: |
          flutter create . --project-name daily_tracker --org com.example

      # 3. تثبيت المكتبات وتجميع الـ APK
      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      # 4. حفظ وتجهيز الملف للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyTracker-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
