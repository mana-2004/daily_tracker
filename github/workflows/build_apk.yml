name: Build Flutter App & Web

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# إعطاء الصلاحيات اللازمة للسيرفر لنشر الموقع وإنشاء الـ Release
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # المهمة الأولى: بناء تطبيق الأندرويد واستخراج الـ APK
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Scaffolding
        run: flutter create . --project-name daily_tracker --platforms android

      - name: Install Packages
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Publish Android Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Daily Tracker v1.0.0"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # المهمة الثانية: تجميع نفس كود Flutter لموقع ويب ونشره مباشرة
  web-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Web Scaffolding
        run: flutter create . --project-name daily_tracker --platforms web

      - name: Install Packages
        run: flutter pub get

      - name: Build Web App
        run: flutter build web --release --base-href "/daily_tracker/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
